name: school-erp

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  odoo:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: school-erp-odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
      - "8072:8072"
      - "5678:5678"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./custom-addons:/mnt/custom-addons
      - ./docker:/mnt/docker:ro
      - ./docker/odoo.conf:/etc/odoo/odoo.conf:ro
    command: ["sh", "/mnt/docker/entrypoint-debug.sh"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/odoo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  postgres-data:
  odoo-data:
